<style>
  .bookstrip { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin: .2rem 0 1.6rem; }
  .bookcard { display: flex; gap: .9rem; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .7rem .9rem; box-shadow: var(--shadow); transition: transform .25s var(--ease); }
  .bookcard:hover { transform: translateY(-2px); }
  .bookcard img { width: 56px; border-radius: 4px; flex: none; box-shadow: 0 6px 14px -8px rgba(26,35,50,.6); }
  .bookcard .ic { width: 56px; height: 72px; border-radius: 4px; background: var(--amber-soft); color: var(--amber-deep); display: grid; place-items: center; font-size: 1.5rem; flex: none; }
  .bookcard b { display: block; font-family: var(--serif); font-weight: 500; font-size: 1.02rem; line-height: 1.25; }
  .bookcard .muted { font-size: .8rem; }
</style>
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
  <div class="page-head">
    <p class="eyebrow">Research</p>
    <h1>Research themes</h1>
    <p id="intro"></p>
  </div>
  <nav class="theme-nav" id="themenav" aria-label="Research themes"></nav>
  <div class="bookstrip">
    <a class="bookcard" href="https://mitpress.mit.edu/9780262045049/elements-of-functional-magnetic-resonance-imaging/" target="_blank" rel="noopener"><img src="assets/img/cover-elements-of-fmri.jpg" alt="Cover of Elements of Functional Magnetic Resonance Imaging"><span><b>Elements of Functional Magnetic Resonance Imaging</b><span class="muted">Wager &amp; Lindquist, MIT Press 2026 · <u>MIT Press ↗</u></span></span></a>
    <a class="bookcard alt" href="https://torwager.github.io/elements-of-fmri-tutorials" target="_blank" rel="noopener"><span class="ic">⌘</span><span><b>Elements of fMRI tutorials</b><span class="muted">Interactive companion tutorials on GitHub ↗</span></span></a>
    <a class="bookcard" href="https://leanpub.com/principlesoffmri" target="_blank" rel="noopener"><img src="assets/img/cover-principles-of-fmri.jpg" alt="Cover of Principles of fMRI"><span><b>Principles of fMRI</b><span class="muted">Wager &amp; Lindquist, Leanpub e-book ↗</span></span></a>
  </div>
  <div id="themes"><div class="spinner">Loading…</div></div>
</main>
<div id="site-footer"></div>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/layout.js"></script>
<script>
(async function () {
  const r = await CL.getJSON("data/research.json");
  const esc = CL.esc;
  document.getElementById("intro").textContent = r.intro;
  document.getElementById("themenav").innerHTML = r.themes.map(t => `<a href="#${esc(t.id)}">${esc(t.title)}</a>`).join("");
  // link each theme to the matching publication tags
  const TAGS = { belief: "topic=expectation_learning,placebo", "brain-body": "topic=brain_body", affect: "topic=emotion", pain: "topic=pain,chronic_pain&approach=neuromarker", craving: "topic=reward_craving", topology: "approach=machine_learning,neuroimaging_methods" };
  document.getElementById("themes").innerHTML = r.themes.map((t, i) => `<section class="theme${i % 2 ? " flip" : ""} rv" id="${esc(t.id)}">
      <div>
        <p class="eyebrow">Theme ${i + 1}</p>
        <h2>${esc(t.title)}</h2>
        ${t.question ? `<p class="q">${esc(t.question)}</p>` : ""}
        ${t.paragraphs.map(p => `<p>${esc(p)}</p>`).join("")}
        ${TAGS[t.id] ? `<a class="papers-link" href="publications.html?${TAGS[t.id]}">Related publications →</a>` : ""}
      </div>
      ${t.image ? `<figure><a href="assets/img/${esc(t.image)}" target="_blank" rel="noopener"><img src="assets/img/${esc(t.image)}" alt="Figure illustrating ${esc(t.title)}" loading="lazy"></a></figure>` : `<figure class="placeholder" style="border:none;box-shadow:none;background:none"></figure>`}
    </section>`).join("");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rvs = document.querySelectorAll("#themes .rv");
  if (reduce || !("IntersectionObserver" in window)) rvs.forEach(el => el.classList.add("in"));
  else { const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: 0.08 }); rvs.forEach(el => io.observe(el)); }
  if (location.hash) { const el = document.querySelector(location.hash); if (el) setTimeout(() => el.scrollIntoView({ block: "start" }), 50); }
})().catch(e => { document.getElementById("themes").innerHTML = `<div class="empty">Could not load (${CL.esc(e.message)}).</div>`; });
</script>
</body>
</html>
