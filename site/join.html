<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join us | CANlab</title>
<meta name="description" content="Open positions and how to join the Cognitive and Affective Neuroscience Lab at Dartmouth as a postdoc, graduate student, research assistant or visiting scholar, and how to participate in a study.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta property="og:site_name" content="CANlab">
<meta property="og:title" content="Join us | CANlab">
<meta property="og:description" content="Open positions, how to apply, and how to participate in a study.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://torwager.github.io/canlab/join.html">
<meta property="og:image" content="https://torwager.github.io/canlab/assets/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://torwager.github.io/canlab/assets/og.jpg">
<link rel="canonical" href="https://torwager.github.io/canlab/join.html">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="assets/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/app.css">
<style>
  .study { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius); padding: 1.3rem 1.5rem; max-width: 860px; box-shadow: var(--shadow); display: grid; gap: .6rem; }
  .study .comp { font-family: var(--serif); font-size: 1.3rem; color: var(--amber-deep); }
</style>
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
  <div class="page-head">
    <p class="eyebrow">Join us</p>
    <h1>Join our team</h1>
    <p id="intro"></p>
  </div>
  <div id="openings" class="openings"></div>
  <div class="section"><h2>Other ways to join</h2></div>
  <div class="cards" id="general"></div>
  <div class="section" id="participate"><h2>Participate in a study</h2></div>
  <p class="prose" id="pintro"></p>
  <div id="studies" style="display:grid;gap:1rem"></div>
</main>
<div id="site-footer"></div>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/layout.js"></script>
<script>
(async function () {
  const j = await CL.getJSON("data/join.json");
  const esc = CL.esc;
  document.getElementById("intro").textContent = j.intro;
  document.getElementById("openings").innerHTML = j.openings.map(o => `<article class="opening rv in">${o.image ? `<a href="${esc(o.url)}" target="_blank" rel="noopener"><img src="assets/img/${esc(o.image)}" alt="${esc(o.title)}"></a>` : ""}<div class="body"><span class="eyebrow" style="margin:0">${esc(o.kind)}</span><h3><a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.title)} ↗</a></h3><p>${esc(o.org)}</p>${o.blurb ? `<p>${esc(o.blurb)}</p>` : ""}<p><a class="btn primary" href="${esc(o.url)}" target="_blank" rel="noopener">${o.kind === "undergraduate" ? "Apply (form)" : "View the posting"}</a></p></div></article>`).join("");
  document.getElementById("general").innerHTML = j.general.map(g => `<article class="card"><h3>${esc(g.title)}</h3><p>${esc(g.blurb)}</p>${g.url ? `<p><a href="${esc(g.url)}" target="_blank" rel="noopener">More information ↗</a></p>` : ""}</article>`).join("");
  document.getElementById("pintro").textContent = j.participate.intro;
  document.getElementById("studies").innerHTML = j.participate.studies.map(s => `<div class="study"><h3 style="margin:0">${esc(s.title)}</h3><p style="margin:0">${esc(s.blurb)}</p>${s.compensation ? `<div class="comp">${esc(s.compensation)}</div>` : ""}<div style="display:flex;gap:.6rem;flex-wrap:wrap"><a class="btn primary" href="${esc(s.screening_url)}" target="_blank" rel="noopener">Online eligibility screening ↗</a>${s.email ? `<a class="btn" href="mailto:${esc(s.email)}">Email ${esc(s.email)}</a>` : ""}</div></div>`).join("");
})().catch(e => { document.getElementById("openings").innerHTML = `<div class="empty">Could not load (${CL.esc(e.message)}).</div>`; });
</script>
</body>
</html>
