name: Journal club (Slack #articles)

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-read the whole channel history"
        type: boolean
        default: false
      social_only:
        description: "Only follow X/Bluesky posts to their papers (use with full to backfill)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch a GitHub OIDC token for Anthropic Workload Identity Federation (only when configured)
        if: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID != '' }}
        run: |
          fetch() { curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > /tmp/anthropic-jwt; }
          fetch
          # GitHub identity tokens expire after ~5 minutes; keep the file fresh for long runs so the SDK can re-exchange it
          (while sleep 240; do fetch; done) &
      - name: Import papers, discussion and tags from Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ARTICLES_CHANNEL: ${{ vars.SLACK_ARTICLES_CHANNEL || 'articles' }}
          JOURNAL_CLUB_ANON: ${{ vars.JOURNAL_CLUB_ANON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID != '' && '/tmp/anthropic-jwt' || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CANLAB_CONTACT_EMAIL: ${{ vars.CANLAB_CONTACT_EMAIL }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then echo "SLACK_BOT_TOKEN secret not set; skipping"; exit 0; fi
          for v in ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN OPENAI_API_KEY ANTHROPIC_WORKSPACE_ID ANTHROPIC_IDENTITY_TOKEN_FILE; do [ -z "${!v}" ] && unset "$v"; done  # an empty ANTHROPIC_API_KEY would shadow federation
          python -m pipeline.slack_articles ${{ inputs.full && '--full' || '' }} ${{ inputs.social_only && '--social-only' || '' }}
      - name: Commit the data
        id: commit
        run: |
          git config user.name "canlab-bot"
          git config user.email "canlab-bot@users.noreply.github.com"
          git add data/journal_club.json
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "journal club: update $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the site (commits made with the workflow token do not trigger the deploy workflow by themselves)
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml -R ${{ github.repository }} -f skip_search=true
